name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -p no:cacheprovider -q

  openpilot-lab:
    name: OpenPilot lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: openpilot/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r openpilot/requirements.txt
      - name: Run Python tests
        working-directory: openpilot
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -p no:cacheprovider -q
      - name: Test native MADS and RVV safety barriers
        working-directory: openpilot/firmware/psa-obdc-bridge
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/mads_state_test.cpp -o /tmp/mads-state-test
          /tmp/mads-state-test
          c++ -std=c++17 -Wall -Wextra -Werror -Itest/stubs -Iinclude test/lka_mads_safety_test.cpp -o /tmp/lka-mads-test
          /tmp/lka-mads-test
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/rvv_safety_test.cpp -o /tmp/rvv-safety-test
          /tmp/rvv-safety-test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check TypeScript and build
        working-directory: frontend
        run: npm run check

  firmware:
    name: Firmware (${{ matrix.project }} / ${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firmware/esp32-gateway
            environment: esp32-waveshare-wifi-readonly
          - project: firmware/esp32-gateway
            environment: esp32-tja1050-serial-diagnostic
          - project: firmware/esp32-gateway
            environment: esp32-tja1050-serial-psa-lab
          - project: firmware/esp32-gateway
            environment: esp32-dual-can-16mhz-serial-diagnostic
          - project: openpilot/firmware/psa-obdc-bridge
            environment: psa-obdc-master-zero-torque
          - project: openpilot/firmware/psa-obdc-bridge
            environment: psa-obdc-satellite
          - project: openpilot/firmware/psa-obdc-bridge
            environment: psa-obdc-master-bench-torque
          - project: openpilot/firmware/psa-obdc-bridge
            environment: psa-obdc-master-bench-rvv
          - project: openpilot/firmware/sensor-logger
            environment: esp32-sensor-logger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile firmware
        working-directory: ${{ matrix.project }}
        run: pio run -e "${{ matrix.environment }}"
