[platformio]
default_envs = psa-obdc-master-zero-torque, psa-obdc-satellite

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DPSA_CAN_BITRATE=500000
    -DPSA_CAN_TX_GPIO=5
    -DPSA_CAN_RX_GPIO=4
    -DPSA_LINK_RX_GPIO=16
    -DPSA_LINK_TX_GPIO=17
    -DPSA_LINK_BAUD=2000000
    -DPSA_MADS_ENABLE_GPIO=33

; Board connected to OBD-C CAN0 (A2/A3), on the EPS side. GPIO 32 only
; controls an external fail-low 3.3 V -> 5 V SBU1 driver; never wire it
; directly to OBD-C A8. This road-validation target is hard-locked to an
; exact zero-torque stock 0x3F2 and automatically returns to bypass at 400 ms.
[env:psa-obdc-master-zero-torque]
build_src_filter = +<master_main.cpp>
build_flags =
    ${env.build_flags}
    -DPSA_ROLE_MASTER=1
    -DPSA_SBU1_GPIO=32
    -DPSA_ALLOW_NONZERO_TORQUE=0

; Board connected to OBD-C CAN2 (B2/B3), on the car/BSI side.
[env:psa-obdc-satellite]
build_src_filter = +<satellite_main.cpp>
build_flags =
    ${env.build_flags}
    -DPSA_ROLE_SATELLITE=1

; Electrically isolated bench target only. It is intentionally not part of
; default_envs and is not a road firmware.
[env:psa-obdc-master-bench-torque]
build_src_filter = +<master_main.cpp>
build_flags =
    ${env.build_flags}
    -DPSA_ROLE_MASTER=1
    -DPSA_SBU1_GPIO=32
    -DPSA_ALLOW_NONZERO_TORQUE=1
    -DPSA_BENCH_ONLY=1
    -DPSA_MAX_TAKEOVER_MS=30000
    -DPSA_MIN_CONTROL_SPEED_KPH=40
    -DPSA_MAX_CONTROL_SPEED_KPH=90

; Bench/closed-loop simulator target for the classic RVV 0x50E path. It keeps
; steering torque at zero, accepts only RVV mode 1, and never modifies LVV.
; Do not install in a vehicle: loss of ESP32 power returns to the stock RVV
; setpoint because this harness has no independent physical cruise-cancel line.
[env:psa-obdc-master-bench-rvv]
build_src_filter = +<master_main.cpp>
build_flags =
    ${env.build_flags}
    -DPSA_ROLE_MASTER=1
    -DPSA_SBU1_GPIO=32
    -DPSA_ALLOW_RVV_CONTROL=1
    -DPSA_BENCH_ONLY=1
    -DPSA_MAX_TAKEOVER_MS=30000
    -DPSA_MIN_CONTROL_SPEED_KPH=40
    -DPSA_MAX_CONTROL_SPEED_KPH=130
