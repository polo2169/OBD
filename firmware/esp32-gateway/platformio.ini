[platformio]
default_envs = esp32-waveshare-wifi-readonly

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3

[env:esp32-readonly]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1
    -DCAN_BUS_ROLE_DIAGNOSTIC=0

[env:esp32-active]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0

; TJA1050 direct, USB serial, GPIO 5/4. CAN TX is restricted in firmware to
; ECU identification, DTC reads, OBD sensor reads and ISO-TP flow control.
[env:esp32-tja1050-serial-diagnostic]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=1
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DCAN_BUS_ROLE_DIAGNOSTIC=1
    -DSERIAL_FRAME_MIRROR=1

; Dedicated experimental PSA profile. In addition to read-only diagnostic
; services it permits only the named NAC actions and 0x27/03-04 security access
; enforced in main.cpp. It is intentionally a separate build target.
[env:esp32-tja1050-serial-psa-lab]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=0
    -DPSA_LAB=1
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DCAN_BUS_ROLE_DIAGNOSTIC=1
    -DSERIAL_FRAME_MIRROR=1

; Recommended two-ESP32 architecture. This board stays connected to the PC,
; listens passively on OBD 6/14 and relays approved diagnostics to the second
; ESP32 over UART2 (GPIO 16/17 at 2 Mbit/s).
[env:esp32-dual-uart-main-diagnostic]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=1
    -DPSA_LAB=0
    -DUART_DUAL_CAN_MASTER=1
    -DCAN_BUS_ROLE_DIAGNOSTIC=0
    -DLIVE_OBD_READ_ONLY=1
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DINTERBOARD_UART_RX_GPIO=16
    -DINTERBOARD_UART_TX_GPIO=17
    -DINTERBOARD_UART_BAUD=2000000
    -DSERIAL_FRAME_MIRROR=1

; Satellite on OBD 3/8. Its USB port is only needed for flashing/debugging;
; normal frames and commands pass through UART2 to the main ESP32.
[env:esp32-dual-uart-satellite-diagnostic]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=1
    -DPSA_LAB=0
    -DUART_DUAL_CAN_SATELLITE=1
    -DCAN_BUS_ROLE_DIAGNOSTIC=1
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DINTERBOARD_UART_RX_GPIO=16
    -DINTERBOARD_UART_TX_GPIO=17
    -DINTERBOARD_UART_BAUD=2000000
    -DSERIAL_FRAME_MIRROR=1

; Same diagnostic satellite wiring, with the firmware-enforced PSA lab
; allowlist. Required for the exact 14 FFFFFF maintenance workflow and the
; named NAC actions; arbitrary writes and routines remain blocked.
[env:esp32-dual-uart-satellite-psa-lab]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=0
    -DPSA_LAB=1
    -DUART_DUAL_CAN_SATELLITE=1
    -DCAN_BUS_ROLE_DIAGNOSTIC=1
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DINTERBOARD_UART_RX_GPIO=16
    -DINTERBOARD_UART_TX_GPIO=17
    -DINTERBOARD_UART_BAUD=2000000
    -DSERIAL_FRAME_MIRROR=1

[waveshare-wifi]
build_flags =
    -DWIFI_ENABLED=1
    -DCAN_TX_GPIO=17
    -DCAN_RX_GPIO=16
    -DSERIAL_FRAME_MIRROR=0

[env:esp32-waveshare-wifi-readonly]
extends = waveshare-wifi
board = esp32dev
build_flags =
    ${waveshare-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-waveshare-wifi-active]
extends = waveshare-wifi
board = esp32dev
build_flags =
    ${waveshare-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0

[tja1050-wifi]
build_flags =
    -DWIFI_ENABLED=1
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DSERIAL_FRAME_MIRROR=0

[env:esp32-tja1050-wifi-readonly]
extends = tja1050-wifi
board = esp32dev
build_flags =
    ${tja1050-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-tja1050-wifi-active]
extends = tja1050-wifi
board = esp32dev
build_flags =
    ${tja1050-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0

[mcp2515]
lib_deps =
    ${env.lib_deps}
    autowp/autowp-mcp2515 @ 1.3.1

[env:esp32-mcp2515-8mhz-readonly]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=8

[env:esp32-mcp2515-8mhz-active]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=8

[env:esp32-mcp2515-16mhz-readonly]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=16

[env:esp32-mcp2515-16mhz-active]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=16

; Production dual-bus profile for the Peugeot 308 T9:
; - native TWAI + existing transceiver on OBD 6/14, receive-only;
; - MCP2515 16 MHz + its transceiver on OBD 3/8, read-only diagnostics.
; GPIO 5/4 remain dedicated to TWAI. SPI uses 18/19/23, CS 27; INT is optional.
[env:esp32-dual-can-16mhz-serial-diagnostic]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=1
    -DPSA_LAB=0
    -DDUAL_CAN=1
    -DMCP2515_CLOCK_MHZ=16
    -DMCP2515_SPI_CS_GPIO=27
    -DMCP2515_INT_GPIO=26
    -DMCP2515_SPI_SPEED_HZ=1000000
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DLIVE_OBD_READ_ONLY=1
    -DSERIAL_FRAME_MIRROR=1

[env:esp32-dual-can-16mhz-serial-psa-lab]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=0
    -DPSA_LAB=1
    -DDUAL_CAN=1
    -DMCP2515_CLOCK_MHZ=16
    -DMCP2515_SPI_CS_GPIO=27
    -DMCP2515_INT_GPIO=26
    -DMCP2515_SPI_SPEED_HZ=1000000
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DLIVE_OBD_READ_ONLY=1
    -DSERIAL_FRAME_MIRROR=1

[env:esp32-s3-readonly]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-s3-active]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
