[platformio]
default_envs = esp32-waveshare-wifi-readonly

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3

[env:esp32-readonly]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-active]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0

; TJA1050 direct, USB serial, GPIO 5/4. CAN TX is restricted in firmware to
; ECU identification, DTC reads, OBD sensor reads and ISO-TP flow control.
[env:esp32-tja1050-serial-diagnostic]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DDIAGNOSTIC_READ_ONLY=1
    -DWIFI_ENABLED=0
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DSERIAL_FRAME_MIRROR=1

[waveshare-wifi]
build_flags =
    -DWIFI_ENABLED=1
    -DCAN_TX_GPIO=17
    -DCAN_RX_GPIO=16
    -DSERIAL_FRAME_MIRROR=0

[env:esp32-waveshare-wifi-readonly]
extends = waveshare-wifi
board = esp32dev
build_flags =
    ${waveshare-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-waveshare-wifi-active]
extends = waveshare-wifi
board = esp32dev
build_flags =
    ${waveshare-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0

[tja1050-wifi]
build_flags =
    -DWIFI_ENABLED=1
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=4
    -DSERIAL_FRAME_MIRROR=0

[env:esp32-tja1050-wifi-readonly]
extends = tja1050-wifi
board = esp32dev
build_flags =
    ${tja1050-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-tja1050-wifi-active]
extends = tja1050-wifi
board = esp32dev
build_flags =
    ${tja1050-wifi.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0

[mcp2515]
lib_deps =
    ${env.lib_deps}
    autowp/autowp-mcp2515 @ 1.3.1

[env:esp32-mcp2515-8mhz-readonly]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=8

[env:esp32-mcp2515-8mhz-active]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=8

[env:esp32-mcp2515-16mhz-readonly]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=16

[env:esp32-mcp2515-16mhz-active]
extends = mcp2515
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
    -DUSE_MCP2515=1
    -DMCP2515_CLOCK_MHZ=16

[env:esp32-s3-readonly]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=1

[env:esp32-s3-active]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DREAD_ONLY=0
