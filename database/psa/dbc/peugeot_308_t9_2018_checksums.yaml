manufacturer: Peugeot
model: 308 II
platform: T9
year: 2018
architecture: AEE2010.full
confidence: community_catalog
sources:
  architecture:
    url: https://github.com/prototux/PSA-RE/blob/74294e99bd8f4decbfcdceabb11c7413dd977f4d/cars/T9.yml
    revision: 74294e99bd8f4decbfcdceabb11c7413dd977f4d
    license: Apache-2.0
  ecu_addresses:
    url: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md
    revision: c1409e60798f66bb63149505826170b5eb3c163f
    license: GPL-3.0
  passive_can_dbc:
    url: https://github.com/commaai/opendbc/blob/master/opendbc/dbc/psa_aee2010_r3.dbc
    revision: master
    role: external_comparison
  vehicle_can_capture:
    file: can(2).jsonl
    captured_at: 2026-08-12
    role: vehicle_validation
notes:
  - PSA-RE confirme l'architecture AEE2010.full pour la plateforme T9.
  - Les captures locales identifient plus précisément une variante de direction compatible AEE2010 R2/EVO : commande de couple BSI vers EPS sur 0x3F2, tandis que la consigne d'angle reste nulle.
  - Le DBC AEE2010 R3 conservé dans opendbc est une base externe de comparaison ; son nom ne constitue pas une identification R3 de cette 308.
  - La révision multiplexée exacte restera à confirmer par l'identification BSI/EPS et la topologie des bus ; le profil conserve donc le libellé source AEE2010.full.
  - Les paires de diagnostic proviennent d'un catalogue communautaire de familles ECU.
  - La présence exacte des calculateurs optionnels dépend de l'équipement du véhicule.
  - Toute adresse doit être confirmée par une réponse UDS avant d'être considérée présente.
  - La consommation carburant passive a été validée sur une capture véhicule de 589,24 s : trame 0x488 à ~10 Hz, compteur P021 observé sur 0..254 avec rebouclage modulo 255.
  - La consommation instantanée n'est pas transmise directement en L/100 km : elle est dérivée de l'incrément du compteur de volume carburant 0x488 et de la vitesse 0x38D.

maintenance:
  policy: catalog_only_until_vehicle_validated
  applicable:
    - abs_bleed
    - air_fuel_adaptation_reset
    - airbag_reset
    - battery_adaptation
    - brake_service_reset
    - crankshaft_relearn
    - throttle_relearn
    - oil_service_reset
    - steering_angle_calibration
    - tire_configuration_reset
    - window_calibration
    - proxy_alignment
  conditional:
    - adblue_reset
    - adaptive_front_lighting_reset
    - coolant_bleed
    - dpf_regeneration
    - egr_adaptation
    - transmission_relearn
    - immobilizer_relearn
    - injector_coding
    - language_change
    - nox_sensor_reset
    - odometer_module_replacement
    - occupant_detection_calibration
    - start_stop_reset
    - sunroof_calibration
    - tpms_reset
    - transport_mode
  not_applicable:
    - air_level_calibration
  notes:
    - Le profil T9 couvre plusieurs motorisations ; AdBlue, FAP, EGR, NOx, boîte et Stop/Start restent conditionnels à l'identification exacte des calculateurs.
    - Les commandes actives existantes du laboratoire PSA ne valent pas validation d'une procédure de maintenance.

networks:
  diagnostic_can:
    bitrate: 500000
    access: obd_pins_3_8
    confidence: community_confirmed
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/README.md#pinout

diagnostic:
  identity_scope: full_profile
  # Un NRC UDS valide suffit à confirmer qu'un calculateur répond. En l'absence
  # totale de réponse au probe, les autres DIDs ne sont pas envoyés.
  probe_did: 0xF190
  probe_payloads:
    - "1001"
    - "1003"
    - "3E00"
    - "22F186"
    - "22F190"
  read_dtcs: true
  dtc_status_mask: 0xFF
  dtc_status_masks:
    - 0xFF
    - 0x09
  # Adressage OBD-II physique standard du calculateur moteur pour le mode
  # capteurs normalisés. Ce mode est distinct des adresses diagnostic PSA.
  obd_request_id: 0x7E0
  obd_response_id: 0x7E8
  live_obd:
    enabled: true
    interval_ms: 1000
    # Complément normalisé au CAN passif AEE2010. Les signaux CAN validés
    # gardent la priorité dans l'interface quand les deux sources existent.
    pids:
      - 0x04
      - 0x05
      - 0x0B
      - 0x0C
      - 0x0D
      - 0x0F
      - 0x11
      - 0x2F
      - 0x33
      - 0x42
      - 0x46
      - 0x49
      - 0x4A
      - 0x5C
  identification_dids:
    # Zones d'identification PSA utilisées par PyPSADiag :
    # ZA = références équipement/type, ZI = fournisseur/système/calibration.
    - 0xF080
    - 0xF0FE
    - 0xF180
    - 0xF181
    - 0xF186
    - 0xF187
    - 0xF188
    - 0xF189
    - 0xF18A
    - 0xF18B
    - 0xF18C
    - 0xF18E
    - 0xF190
    - 0xF191
    - 0xF192
    - 0xF193
    - 0xF194
    - 0xF195
    - 0xF197
  vin_strategies:
    - key: psa_bsi_f190
      label: BSI Peugeot · DID F190
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF190
      confidence: community_confirmed
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L347
    - key: psa_engine_f190
      label: Injection Peugeot · DID F190
      protocol: uds
      request_id: 0x6A8
      response_id: 0x688
      did: 0xF190
      confidence: community_confirmed
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L243
    - key: obd_mode09_vin
      label: OBD-II moteur · Mode 09 PID 02
      protocol: obd
      request_id: 0x7E0
      response_id: 0x7E8
      command: 0x0902
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
  identity_fields:
    - key: boot_software_id
      name: Référence logiciel boot
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF180
      codec: ascii
      confidence: standardized_did
    - key: application_software_id
      name: Référence logiciel application
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF181
      codec: ascii
      confidence: standardized_did
    - key: spare_part_number
      name: Référence pièce
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF187
      codec: ascii
      confidence: standardized_did
    - key: software_version
      name: Version logiciel
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF189
      codec: ascii
      confidence: standardized_did
    - key: ecu_serial_number
      name: Numéro de série ECU
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF18C
      codec: ascii
      confidence: standardized_did


passive_can:
  enabled: true
  bitrate: 500000
  mode: read_only
  confidence: vehicle_validated
  source_ref: passive_can_dbc
  validation:
    capture_ref: can(2).jsonl
    duration_s: 589.24
    total_frames: 926637
    unique_ids: 67
    fuel_frame_count: 5895
    fuel_frame_period_ms_median: 99.992
    notes:
      - Le DBC AEE2010 R3 sert de dictionnaire de signaux ; l'identification de la voiture reste AEE2010.full avec variante locale à confirmer.
      - Les trames 0x208, 0x38D et 0x488 ont été observées directement sur ce véhicule et leurs champs ci-dessous sont cohérents avec la capture.
      - Sur 0x488 byte 1, les valeurs observées vont de 0 à 254 ; 0xFF n'a pas été observé. Le compteur reboucle donc avec un modulus de 255 sur cette capture.

  frames:
    - id: 0x208
      name: Dyn_CMM
      period_ms: 10
      transmitter: engine
      confidence: vehicle_validated
      signals:
        - key: engine_rpm
          name: Régime moteur
          dbc_signal: P000_Com_nEng
          start_bit: 7
          length: 16
          byte_order: big_endian
          signed: false
          factor: 0.125
          offset: 0
          unit: rpm
          decode_hint: "uint16_be(data[0:2]) * 0.125"
        - key: accelerator_pedal
          name: Position pédale accélérateur
          dbc_signal: P002_Com_rAPP
          start_bit: 24
          length: 8
          byte_order: little_endian
          signed: false
          factor: 0.5
          offset: 0
          unit: percent
          decode_hint: "data[3] * 0.5"

    - id: 0x38D
      name: HS2_DYN_ABR_38D
      period_ms: 40
      transmitter: abs_esp
      confidence: vehicle_validated
      signals:
        - key: vehicle_speed
          name: Vitesse véhicule roues
          dbc_signal: VITESSE_VEHICULE_ROUES
          start_bit: 7
          length: 16
          byte_order: big_endian
          signed: false
          factor: 0.01
          offset: 0
          unit: km/h
          decode_hint: "uint16_be(data[0:2]) * 0.01"
        - key: wheel_distance_counter
          name: Distance cumulée roues
          dbc_signal: DISTANCE_ROUES
          start_bit: 23
          length: 16
          byte_order: big_endian
          signed: false
          factor: 0.1
          offset: 0
          unit: m
          raw_modulus: 65536
          decode_hint: "uint16_be(data[2:4]) * 0.1"

    - id: 0x488
      name: Dat_CMM
      period_ms: 100
      transmitter: engine
      confidence: vehicle_validated
      signals:
        - key: fuel_volume_counter
          name: Compteur volume carburant consommé
          dbc_signal: P021_Com_volFlCons
          byte_index: 1
          start_bit: 8
          length: 8
          byte_order: little_endian
          signed: false
          factor: 80
          offset: 0
          unit: mm^3
          raw_min_observed: 0
          raw_max_observed: 254
          raw_modulus: 255
          liters_per_tick: 0.00008
          decode_hint: "data[1]"
          notes:
            - Le DBC décrit P021 avec un facteur de 80 mm^3 par unité.
            - Sur la voiture, ce champ se comporte comme un compteur de volume cumulatif modulo 255, pas comme une valeur instantanée en L/100 km.
            - Un compteur immobile pendant une décélération indique une consommation de carburant nulle sur cette fenêtre, cohérente avec la coupure d'injection.

    - id: 0x552
      name: DAT4_BSI_AEE2010
      transmitter: bsi
      confidence: vehicle_validated
      signals:
        - key: odometer_km
          name: Kilométrage absolu
          dbc_signal: P015_Com_lTotDst
          byte_index: [4, 5, 6]
          start_bit: 39
          length: 24
          byte_order: big_endian
          signed: false
          factor: 1
          offset: 0
          unit: km
          decode_hint: "uint24_be(data[4:7])"
          notes:
            - "Confirmé par la documentation constructeur PSA du champ 552 (kilométrage absolu, octets 5-7 en indexation 1)."
            - "Recoupé sur 29 captures matérielles indépendantes du 2026-08-01 au 2026-08-13 : progression strictement monotone 104 473 → 104 975 km, sans retour en arrière ni rebouclage, cohérente avec l'usage quotidien réel du véhicule."

  derived_signals:
    - key: fuel_delta_ticks
      name: Incrément de carburant
      inputs:
        - fuel_volume_counter
      formula: "(current_raw - previous_raw + 255) % 255"
      unit: tick
      notes:
        - Calculer uniquement entre deux échantillons 0x488 consécutifs.
        - Ignorer un intervalle anormalement long ou une perte de synchronisation avant de reprendre le calcul.

    - key: fuel_delta_l
      name: Volume consommé sur l'intervalle
      inputs:
        - fuel_delta_ticks
      formula: "fuel_delta_ticks * 0.00008"
      unit: L

    - key: fuel_rate
      name: Débit carburant
      inputs:
        - fuel_delta_l
        - delta_time_s
      formula: "fuel_delta_l * 3600 / delta_time_s"
      unit: L/h
      smoothing:
        method: sliding_window
        recommended_window_ms: 1500
        min_window_ms: 1000
        max_window_ms: 2000
      notes:
        - Le lissage est nécessaire car un tick vaut 80 µL ; à 100 ms, la dérivée brute est naturellement quantifiée.

    - key: instant_fuel_consumption
      name: Consommation instantanée
      inputs:
        - fuel_rate
        - vehicle_speed
      formula: "fuel_rate / vehicle_speed * 100"
      unit: L/100km
      valid_when: "vehicle_speed >= 5"
      stopped_behavior:
        display: fuel_rate
        unit: L/h
      notes:
        - À très basse vitesse, L/100 km devient numériquement instable ; afficher L/h sous le seuil.

    - key: trip_fuel
      name: Carburant consommé trajet
      inputs:
        - fuel_delta_l
      formula: "sum(fuel_delta_l)"
      unit: L

    - key: trip_distance
      name: Distance trajet
      inputs:
        - wheel_distance_counter
      formula: "sum(((current_raw - previous_raw + 65536) % 65536) * 0.1)"
      unit: m

    - key: average_fuel_consumption
      name: Consommation moyenne trajet
      inputs:
        - trip_fuel
        - trip_distance
      formula: "trip_fuel / (trip_distance / 1000) * 100"
      unit: L/100km
      valid_when: "trip_distance > 0"

ecus:
  - key: engine
    name: Calculateur moteur / injection
    family: INJ
    request_id: 0x6A8
    response_id: 0x688
    protocol: uds
    confidence: community_family_catalog
    access: read_only
    network: diagnostic_can
    optional: false
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L243
    dtc_catalogs:
