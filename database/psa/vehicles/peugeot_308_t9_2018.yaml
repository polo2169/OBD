manufacturer: Peugeot
model: 308 II
platform: T9
year: 2018
architecture: AEE2010.full
confidence: community_catalog
sources:
  architecture:
    url: https://github.com/prototux/PSA-RE/blob/74294e99bd8f4decbfcdceabb11c7413dd977f4d/cars/T9.yml
    revision: 74294e99bd8f4decbfcdceabb11c7413dd977f4d
    license: Apache-2.0
  ecu_addresses:
    url: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md
    revision: c1409e60798f66bb63149505826170b5eb3c163f
    license: GPL-3.0
notes:
  - PSA-RE confirme l'architecture AEE2010.full pour la plateforme T9.
  - Les captures locales identifient plus précisément une variante de direction compatible AEE2010 R2/EVO : commande de couple BSI vers EPS sur 0x3F2, tandis que la consigne d'angle reste nulle.
  - Le DBC AEE2010 R3 conservé dans opendbc est une base externe de comparaison ; son nom ne constitue pas une identification R3 de cette 308.
  - La révision multiplexée exacte restera à confirmer par l'identification BSI/EPS et la topologie des bus ; le profil conserve donc le libellé source AEE2010.full.
  - Les paires de diagnostic proviennent d'un catalogue communautaire de familles ECU.
  - La présence exacte des calculateurs optionnels dépend de l'équipement du véhicule.
  - Toute adresse doit être confirmée par une réponse UDS avant d'être considérée présente.

maintenance:
  policy: catalog_only_until_vehicle_validated
  applicable:
    - abs_bleed
    - air_fuel_adaptation_reset
    - airbag_reset
    - battery_adaptation
    - brake_service_reset
    - crankshaft_relearn
    - throttle_relearn
    - oil_service_reset
    - steering_angle_calibration
    - tire_configuration_reset
    - window_calibration
    - proxy_alignment
  conditional:
    - adblue_reset
    - adaptive_front_lighting_reset
    - coolant_bleed
    - dpf_regeneration
    - egr_adaptation
    - transmission_relearn
    - immobilizer_relearn
    - injector_coding
    - language_change
    - nox_sensor_reset
    - odometer_module_replacement
    - occupant_detection_calibration
    - start_stop_reset
    - sunroof_calibration
    - tpms_reset
    - transport_mode
  not_applicable:
    - air_level_calibration
  notes:
    - Le profil T9 couvre plusieurs motorisations ; AdBlue, FAP, EGR, NOx, boîte et Stop/Start restent conditionnels à l'identification exacte des calculateurs.
    - Les commandes actives existantes du laboratoire PSA ne valent pas validation d'une procédure de maintenance.

networks:
  diagnostic_can:
    bitrate: 500000
    access: obd_pins_3_8
    confidence: community_confirmed
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/README.md#pinout

diagnostic:
  identity_scope: full_profile
  # Un NRC UDS valide suffit à confirmer qu'un calculateur répond. En l'absence
  # totale de réponse au probe, les autres DIDs ne sont pas envoyés.
  probe_did: 0xF190
  probe_payloads:
    - "1001"
    - "1003"
    - "3E00"
    - "22F186"
    - "22F190"
  read_dtcs: true
  dtc_status_mask: 0xFF
  dtc_status_masks:
    - 0xFF
    - 0x09
  # Adressage OBD-II physique standard du calculateur moteur pour le mode
  # capteurs normalisés. Ce mode est distinct des adresses diagnostic PSA.
  obd_request_id: 0x7E0
  obd_response_id: 0x7E8
  live_obd:
    enabled: true
    interval_ms: 1000
    # Complément normalisé au CAN passif AEE2010. Les signaux CAN validés
    # gardent la priorité dans l'interface quand les deux sources existent.
    pids:
      - 0x04
      - 0x05
      - 0x0B
      - 0x0C
      - 0x0D
      - 0x0F
      - 0x11
      - 0x2F
      - 0x33
      - 0x42
      - 0x46
      - 0x49
      - 0x4A
      - 0x5C
  identification_dids:
    # Zones d'identification PSA utilisées par PyPSADiag :
    # ZA = références équipement/type, ZI = fournisseur/système/calibration.
    - 0xF080
    - 0xF0FE
    - 0xF180
    - 0xF181
    - 0xF186
    - 0xF187
    - 0xF188
    - 0xF189
    - 0xF18A
    - 0xF18B
    - 0xF18C
    - 0xF18E
    - 0xF190
    - 0xF191
    - 0xF192
    - 0xF193
    - 0xF194
    - 0xF195
    - 0xF197
  vin_strategies:
    - key: psa_bsi_f190
      label: BSI Peugeot · DID F190
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF190
      confidence: community_confirmed
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L347
    - key: psa_engine_f190
      label: Injection Peugeot · DID F190
      protocol: uds
      request_id: 0x6A8
      response_id: 0x688
      did: 0xF190
      confidence: community_confirmed
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L243
    - key: obd_mode09_vin
      label: OBD-II moteur · Mode 09 PID 02
      protocol: obd
      request_id: 0x7E0
      response_id: 0x7E8
      command: 0x0902
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
  identity_fields:
    - key: boot_software_id
      name: Référence logiciel boot
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF180
      codec: ascii
      confidence: standardized_did
    - key: application_software_id
      name: Référence logiciel application
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF181
      codec: ascii
      confidence: standardized_did
    - key: spare_part_number
      name: Référence pièce
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF187
      codec: ascii
      confidence: standardized_did
    - key: software_version
      name: Version logiciel
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF189
      codec: ascii
      confidence: standardized_did
    - key: ecu_serial_number
      name: Numéro de série ECU
      protocol: uds
      request_id: 0x752
      response_id: 0x652
      did: 0xF18C
      codec: ascii
      confidence: standardized_did

ecus:
  - key: engine
    name: Calculateur moteur / injection
    family: INJ
    request_id: 0x6A8
    response_id: 0x688
    protocol: uds
    confidence: community_family_catalog
    access: read_only
    network: diagnostic_can
    optional: false
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L243
    dtc_catalogs:
      - EDC17C60
      - DCM62
      - DCM62_F
      - CMM_DCM71
      - CMM_DCM71_F
      - VD46
      - V46
      - V46_21
      - V46_6
      - MEVD17_4_2
      - MEVD17_4_4

  - key: gearbox
    name: Aisin TF-71SC / AT6 III (EAT6)
    family: BOITEVIT
    request_id: 0x6A9
    response_id: 0x689
    # Cette EAT6 exige à la fois BS=0 et un Flow Control au DLC naturel de
    # trois octets. FC 30 00 00 rembourré à huit octets est ignoré.
    flow_control_blocksize: 0
    isotp_tx_padding: null
    protocol: uds
    confidence: vehicle_identified
    access: read_only
    network: diagnostic_can
    optional: true
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L250
    aliases:
      - EAT6
      - AT6 III
      - Aisin TF-71SC
    telecoding_variant: BVA_AM6_AT6_UDS
    telecoding_write_allowed: false
    identification_dids:
      - 0x2100
      - 0x2101
    dtc_catalogs:
      - BVA_EATN8
      - BVA_AM6_AT6_UDS
    dtc_status_masks:
      - 0x09
      - 0xFF
    notes:
      - "F080 observé: PSA 9805709280 (deux occurrences dans la zone)."
      - "F0FE observé: FFFF00003056100A0D02510708FFFFFF0002000001920681."
      - "2100=00FEFFFCFF003801; 2101=00FEFFFEFFBFBE."
      - "Réponses longues confirmées avec Flow Control 30 00 00 non rembourré (DLC=3)."

  - key: abs_esp
    name: ABS / ESP90 Bosch 9.0
    family: ABRASR
    request_id: 0x6AD
    response_id: 0x68D
    protocol: uds
    confidence: vehicle_identified
    access: read_only
    network: diagnostic_can
    optional: false
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L227
    aliases:
      - ESP90
      - Bosch ESP 9.0
    # Confirmé par les zones F080/F0FE et par les réponses 2100..2103 du VIN.
    # La référence PSA 9812786180 est répertoriée comme Bosch ESP 9.0 ; le
    # motif complet 2102=06000000A400 correspond aussi aux lectures ESP90
    # communautaires. Ne plus proposer le schéma incompatible ESPMK100_UDS.
    telecoding_variant: ESP90
    # Plusieurs clés ESP90 existent. Une mauvaise clé peut verrouiller le
    # télécodage du calculateur : sauvegarde/lecture oui, écriture non tant que
    # la clé exacte de cet exemplaire n'est pas prouvée indépendamment.
    telecoding_write_allowed: false
    identification_dids:
      - 0x2100
      - 0x2101
      - 0x2102
      - 0x2103
    dtc_catalogs:
      - ESP90
      - ABRASR
    # 0x09 cible d'abord les défauts échoués/confirmés. 0xFF reste un repli
    # exhaustif, sans présenter les moniteurs 0x40/0x50 comme des pannes.
    dtc_status_masks:
      - 0x09
      - 0xFF
    notes:
      - "F080 observé: PSA 9826694380 et 9812786180."
      - "F0FE observé: 00000000039201061103D41802FFFFFF0002000001928338."
      - "2100=06A29212BDFB210000000040FF000000A420200B8CE3FFE0A01004FF01."
      - "2101=06FFFFF7FFFFFFEFFFFFFFFFFFFFFDFFFF7FFFEFFFFBFFFFEFFE7EFF."
      - "2102=06000000A400; 2103=06FFFDFFFF; sens détaillé non documenté."

  - key: bsi
    name: Boîtier de servitude intelligent
    family: BMF_UDS_PSA
    request_id: 0x752
    response_id: 0x652
    protocol: uds
    confidence: community_family_catalog
