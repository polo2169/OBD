manufacturer: Fiat
model: "500"
platform: 312 / génération à confirmer
year: 2007+
architecture: Fiat CAN générique
confidence: partial_community_catalog
sources:
  ecu_addresses:
    url: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L354-L357
    revision: c1409e60798f66bb63149505826170b5eb3c163f
    license: GPL-3.0
  obd_vehicle_information:
    url: https://github.com/OBDb/SAEJ1979
    license: CC-BY-SA-4.0
notes:
  - Profil initial consacré à l'identification en lecture seule, pas encore à un scan complet des ECU Fiat.
  - "L'année, la motorisation et le marché doivent être renseignés avant d'étendre le catalogue : 500 type 312, 500X et 500e n'ont pas la même architecture."
  - Le VIN est demandé d'abord par le service OBD-II normalisé Mode 09 PID 02 sur les broches OBD 6/14.
  - Les paires 7B0/7C0 et 7B0/7C3 viennent d'un catalogue communautaire et sont seulement des replis expérimentaux.

networks:
  diagnostic_can:
    bitrate: 500000
    access: obd_pins_6_14
    confidence: standard_obd_candidate

diagnostic:
  identity_scope: identity_only
  obd_request_id: 0x7E0
  obd_response_id: 0x7E8
  vin_strategies:
    - key: obd_mode09_vin
      label: OBD-II moteur · Mode 09 PID 02
      protocol: obd
      request_id: 0x7E0
      response_id: 0x7E8
      command: 0x0902
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
    - key: fiat_body_f190_candidate
      label: Body Computer Fiat · DID F190 expérimental
      protocol: uds
      request_id: 0x7B0
      response_id: 0x7C0
      did: 0xF190
      confidence: address_documented_command_experimental
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L354-L355
    - key: fiat_cluster_f190_candidate
      label: Combiné Fiat · DID F190 expérimental
      protocol: uds
      request_id: 0x7B0
      response_id: 0x7C3
      did: 0xF190
      confidence: address_documented_command_experimental
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L356-L357
  identity_fields:
    - key: calibration_id
      name: Identifiant de calibration
      protocol: obd
      request_id: 0x7E0
      response_id: 0x7E8
      pid: 0x04
      codec: indexed_ascii
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
    - key: calibration_verification_number
      name: Numéro de vérification de calibration (CVN)
      protocol: obd
      request_id: 0x7E0
      response_id: 0x7E8
      pid: 0x06
      codec: indexed_hex
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
    - key: ecu_name
      name: Nom du calculateur OBD
      protocol: obd
      request_id: 0x7E0
      response_id: 0x7E8
      pid: 0x0A
      codec: indexed_ascii
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979

ecus:
  - key: engine
    name: Calculateur moteur / OBD-II
    family: INJ_GENERIC
    request_id: 0x7E0
    response_id: 0x7E8
    protocol: obd2
    confidence: standardized_address_candidate
    access: read_only
    network: diagnostic_can
    optional: false
  - key: body_computer
    name: Body Computer / BSI Fiat
    family: BMF_CAN_FIAT
    request_id: 0x7B0
    response_id: 0x7C0
    protocol: uds_or_kwp_to_confirm
    confidence: community_family_catalog
    access: read_only
    network: diagnostic_can
    optional: false
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L354-L355
  - key: instrument_cluster
    name: Combiné d'instruments Fiat
    family: COMBINE_CAN_FIAT
    request_id: 0x7B0
    response_id: 0x7C3
    protocol: uds_or_kwp_to_confirm
    confidence: community_family_catalog
    access: read_only
    network: diagnostic_can
    optional: false
    source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L356-L357
