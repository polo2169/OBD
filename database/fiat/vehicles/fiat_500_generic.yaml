notes:
  - Profil initial consacré à l'identification en lecture seule, pas encore à un scan complet des ECU Fiat.
  - "L'année, la motorisation et le marché doivent être renseignés avant d'étendre le catalogue : 500 type 312, 500X et 500e n'ont pas la même architecture."
  - Le VIN est demandé d'abord par le service OBD-II normalisé Mode 09 PID 02 sur les broches OBD 6/14.
  - La Fiat 500 type 312 testée répond en EOBD CAN 29 bits sur la paire moteur 18DA10F1/18DAF110.
  - "Les trames 0218A006, 0628A001, 0810A000, 0A18A000, 0C1CA000 et 0C28A000 de la source ouverte sont aussi présentes dans la capture du VIN ZFA31200000504700. Leur décodage reste candidat jusqu'à une action annotée ou un recoupement indépendant."
  - "Confirmations conducteur pour ZFA31200000504700 : régime moteur 0618A001, pédale de frein 0810A000 et témoin de porte conducteur 0A18A000. Le niveau brut de freinage, le frein de stationnement et les autres bits de ces trames restent candidats."
  - "Sur 0618A001, le régime moteur est validé sur véhicule. L'octet 7 reste une position de papillon recoupée mais candidate, et l'octet 4 une charge/pression d'air brute candidate ; comparaison requise avec les PID EOBD 01/11 et 01/0B."
  - Les paires 7B0/7C0 et 7B0/7C3 viennent d'un catalogue communautaire ; elles restent désactivées tant que leur routage 6/14 n'est pas validé sur véhicule.

maintenance:
  policy: catalog_only_until_vehicle_validated
  applicable:
    - air_fuel_adaptation_reset
    - crankshaft_relearn
    - throttle_relearn
    - oil_service_reset
    - steering_angle_calibration
    - window_calibration
  conditional:
    - abs_bleed
    - adaptive_front_lighting_reset
    - airbag_reset
    - battery_adaptation
    - brake_service_reset
    - coolant_bleed
    - egr_adaptation
    - transmission_relearn
    - immobilizer_relearn
    - injector_coding
    - language_change
    - odometer_module_replacement
    - occupant_detection_calibration
    - start_stop_reset
    - sunroof_calibration
    - tpms_reset
    - tire_configuration_reset
    - transport_mode
    - proxy_alignment
  not_applicable:
    - adblue_reset
    - air_level_calibration
    - dpf_regeneration
    - nox_sensor_reset
  notes:
    - Applicabilité établie pour une Fiat 500 type 312 essence 1.2 de 2010 ; les équipements optionnels doivent être détectés avant affichage comme disponibles.
    - Aucune séquence de maintenance Fiat n'est encore autorisée à l'émission : les adresses Body/Combiné restent à valider sur le véhicule.

networks:
  diagnostic_can:
    bitrate: 500000
    access: obd_pins_6_14
    confidence: standard_obd_candidate

diagnostic:
  identity_scope: identity_only
  obd_request_id: 0x18DB33F1
  obd_response_id: 0x18DAF110
  obd_flow_control_id: 0x18DA10F1
  obd_flow_control_blocksize: 0
  live_obd:
    enabled: true
    interval_ms: 1000
    # Lectures normalisées Mode 01 uniquement. La liste est volontairement
    # bornée et reste filtrée une seconde fois par l'allowlist du firmware.
    pids:
      - 0x04  # charge moteur
      - 0x05  # température liquide de refroidissement
      - 0x06  # correction richesse court terme B1
      - 0x07  # correction richesse long terme B1
      - 0x0A  # pression carburant basse pression si exposée
      - 0x0B  # pression collecteur
      - 0x0C  # régime
      - 0x0D  # vitesse
      - 0x0E  # avance à l'allumage
      - 0x0F  # température air admission
      - 0x10  # débit d'air massique si exposé
      - 0x11  # papillon
      - 0x14  # tension lambda amont B1S1 si exposée
      - 0x15  # tension lambda aval B1S2 si exposée
      - 0x1F  # temps depuis démarrage
      - 0x2E  # commande purge canister
      - 0x2F  # niveau carburant si exposé
      - 0x33  # pression barométrique
      - 0x42  # tension calculateur / batterie
      - 0x43  # charge moteur absolue
      - 0x44  # richesse commandée lambda
      - 0x45  # position relative papillon
      - 0x46  # température ambiante si exposée
      - 0x47  # position papillon voie B
      - 0x48  # position papillon voie C
      - 0x49  # pédale accélérateur D
      - 0x4A  # pédale accélérateur E
      - 0x4C  # commande actionneur papillon
      - 0x5A  # position relative accélérateur
      - 0x5C  # température huile si exposée
      - 0x5D  # calage injection si exposé
      - 0x5E  # débit carburant si exposé
  vin_strategies:
    - key: obd_mode09_vin
      label: OBD-II moteur · Mode 09 PID 02
      protocol: obd
      request_id: 0x18DB33F1
      response_id: 0x18DAF110
      flow_control_id: 0x18DA10F1
      flow_control_blocksize: 0
      command: 0x0902
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
    - key: fiat_body_f190_candidate
      label: Body Computer Fiat · DID F190 expérimental
      protocol: uds
      enabled: false
      request_id: 0x7B0
      response_id: 0x7C0
      did: 0xF190
      confidence: address_documented_command_experimental
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L354-L355
    - key: fiat_cluster_f190_candidate
      label: Combiné Fiat · DID F190 expérimental
      protocol: uds
      enabled: false
      request_id: 0x7B0
      response_id: 0x7C3
      did: 0xF190
      confidence: address_documented_command_experimental
      source: https://github.com/ludwig-v/arduino-psa-diag/blob/c1409e60798f66bb63149505826170b5eb3c163f/ECU_LIST.md#L356-L357
  identity_fields:
    - key: calibration_id
      name: Identifiant de calibration
      protocol: obd
      request_id: 0x18DB33F1
      response_id: 0x18DAF110
      flow_control_id: 0x18DA10F1
      flow_control_blocksize: 0
      pid: 0x04
      codec: indexed_ascii
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
    - key: calibration_verification_number
      name: Numéro de vérification de calibration (CVN)
      protocol: obd
      request_id: 0x18DB33F1
      response_id: 0x18DAF110
      flow_control_id: 0x18DA10F1
      flow_control_blocksize: 0
      pid: 0x06
      codec: indexed_hex
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979
    - key: ecu_name
      name: Nom du calculateur OBD
      protocol: obd
      request_id: 0x18DB33F1
      response_id: 0x18DAF110
      flow_control_id: 0x18DA10F1
      flow_control_blocksize: 0
      pid: 0x0A
      codec: indexed_ascii
      confidence: standardized
      source: https://github.com/OBDb/SAEJ1979

