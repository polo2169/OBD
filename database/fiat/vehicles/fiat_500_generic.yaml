          confidence: family_candidate
        - key: alternator_not_charging_warning
          name: Alerte alternateur / absence de charge
          byte: 2
          bit_offset: 4
          bit_length: 1
          codec: boolean
          status: community_documented
          confidence: family_candidate
        - key: low_fuel_warning
