broadcast_can:
  scope: passive_read_only
  validation_policy: >-
    Un signal passe à validated_on_vehicle uniquement lorsqu'il est confirmé
    sur la capture du véhicule et recoupé avec une source indépendante ou une
    action conducteur explicitement annotée. La présence d'une trame seule ne
    suffit pas à valider son décodage.
  networks:
    body_can_slow:
      bitrate: 50000
      confidence: community_vehicle_cross_check
      note: Réseau lent utilisé par le projet communautaire Fiat 500.
    powertrain_can:
      bitrate: 500000
      confidence: community_vehicle_cross_check
      note: Réseau moteur rapide utilisé par le projet communautaire Fiat 500.
  messages:
    - id: 0x0618A001
      name: engine_broadcast
      network: powertrain_can
      format: extended_29bit
      dlc: 8
      status: partially_validated
      confidence: validated_on_vehicle
      sources:
        - vehicle_capture_fiat_500_type_312_reference
        - fiat_500_can_reverse_engineering
        - fiat_engine_broadcast_reverse_engineering
      signals:
        - key: engine_speed
          name: Régime moteur
          status: validated_on_vehicle
          confidence: validated_driver_action
          note: Présence et corrélation avec le régime moteur confirmées sur le véhicule. Le codage exact doit rester dans le décodeur validé associé.
        - key: intake_air_load_or_pressure_raw
          name: Charge ou pression d'air admission brute
          byte: 4
          bit_offset: 0
          bit_length: 8
          codec: unsigned_raw
          status: candidate_cross_checked
          confidence: community_candidate_cross_checked_with_vehicle_capture
          note: Valeur brute recoupée, mais la grandeur physique exacte et l'échelle doivent encore être comparées au PID OBD Mode 01 PID 0B.
        - key: throttle_position_raw
          name: Position papillon brute
          byte: 7
          bit_offset: 0
          bit_length: 8
          codec: linear
          factor: 0.3921568627
          offset: 0
          unit: "%"
          range: [0, 100]
          status: candidate_cross_checked
          confidence: community_candidate_cross_checked_with_vehicle_capture
          note: Conversion communautaire 0..255 vers 0..100 %. À comparer au PID OBD Mode 01 PID 11 avant validation complète.

    - id: 0x0810A000
      name: braking_status
      network: powertrain_can
      format: extended_29bit
      dlc: 4
      status: partially_validated
      confidence: validated_on_vehicle
      sources:
        - vehicle_capture_fiat_500_type_312_reference
        - fiat_500_can_reverse_engineering
      signals:
        - key: brake_pedal_pressed
          name: Pédale de frein
          byte: 2
          bit_offset: 4
          bit_length: 4
          codec: threshold
          threshold: 0x3
          status: validated_on_vehicle
          confidence: validated_driver_action
          note: Nibble haut 0x1 au repos, 0x3 à l'allumage des feux stop, 0x7 lors d'un appui normal/fort.
        - key: braking_level_raw
          name: Niveau de freinage brut
          byte: 2
          bit_offset: 4
          bit_length: 4
          codec: unsigned_raw
          status: candidate
          confidence: medium
          note: Niveau ordinal non étalonné; ne pas l'afficher comme une pression en bar.

    - id: 0x0A18A000
      name: body_status
      network: powertrain_can
      format: extended_29bit
      dlc: 8
      status: partially_validated
      confidence: validated_on_vehicle
      sources:
        - vehicle_capture_fiat_500_type_312_reference
        - fiat_500_can_reverse_engineering
      signals:
        - key: driver_door_open_warning
          name: Témoin de porte conducteur ouverte
          byte: 2
          bit_offset: 3
          bit_length: 1
          codec: boolean
          status: validated_on_vehicle
          confidence: validated_driver_action
        - key: parking_brake
          name: Frein de stationnement
          byte: 0
          bit_offset: 5
          bit_length: 1
          codec: boolean
          status: candidate
          confidence: medium
        - key: key_contact_on
          name: Contact établi
          byte: 2
          bit_offset: 6
          bit_length: 1
          codec: boolean
          status: candidate
          confidence: medium
        - key: ignition_active
          name: Phase démarrage / allumage active
          byte: 2
          bit_offset: 7
          bit_length: 1
          codec: boolean
          status: candidate
          confidence: medium
        - key: city_mode
          name: Mode City
          byte: 4
          bit_offset: 3
          bit_length: 1
          codec: boolean
          status: candidate
          confidence: medium
        - key: rear_window_heater
          name: Dégivrage arrière
          byte: 6
          bit_offset: 4
          bit_length: 1
          codec: boolean
          status: candidate
          confidence: medium
        - key: wheel_activity_counter_raw
          name: Compteur d'activité des roues brut
          byte: 7
          codec: unsigned_raw
          status: candidate
          confidence: low

    - id: 0x04294000
      name: vehicle_speed_broadcast
      network: body_can_slow
      format: extended_29bit
      dlc: 8
      status: validated_from_independent_community_code
      confidence: community_cross_checked
      sources:
        - fiat_canbus_gaming
        - krzysztof_fiat_can_project
      signals:
        - key: vehicle_speed_raw
          name: Vitesse véhicule brute
          byte_start: 0
          byte_length: 2
          byte_order: big_endian_candidate
          codec: unsigned_raw
          status: validated_signal_presence
          confidence: community_cross_checked
          note: Les octets 0 et 1 varient avec la vitesse. L'échelle physique exacte n'est pas inscrite ici faute de formule indépendamment validée.

    - id: 0x02214000
      name: direction_indicator_status
      network: body_can_slow
      format: extended_29bit
      dlc: 8
      status: community_family_candidate
      confidence: community_family_candidate_not_vehicle_validated
      sources:
        - fiat_canbus_gaming
      signals:
        - key: left_indicator
          name: Clignotant gauche
          byte: 2
          bit_offset: 1
          bit_length: 1
          codec: boolean
          status: community_documented
          confidence: family_candidate
        - key: right_indicator
          name: Clignotant droit
          byte: 2
          bit_offset: 2
          bit_length: 1
          codec: boolean
          status: community_documented
          confidence: family_candidate
        - key: rear_window_heater_indicator
          name: Témoin dégivrage arrière
          byte: 2
          bit_offset: 3
          bit_length: 1
          codec: boolean
          status: community_documented
          confidence: family_candidate
        - key: high_beam_indicator
          name: Témoin feux de route
          byte: 1
          bit_offset: 3
          bit_length: 1
          codec: boolean
          status: community_documented
          confidence: family_candidate

    - id: 0x06214000
      name: door_and_key_status
      network: body_can_slow
      format: extended_29bit
      dlc: 8
      status: community_family_candidate
      confidence: community_family_candidate_not_vehicle_validated
      sources:
        - fiat_canbus_gaming
      signals:
        - key: right_front_door_open
          name: Porte avant droite ouverte
          byte: 1
          bit_offset: 0
          bit_length: 1
          codec: boolean
          status: community_documented
          confidence: family_candidate
        - key: left_front_door_open
          name: Porte avant gauche ouverte
          byte: 1
          bit_offset: 1
          bit_length: 1
          codec: boolean
          status: community_documented
